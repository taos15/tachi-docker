name: MultiArch Master CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "**.md"
    tags:
      - v*

  repository_dispatch:
    types: [Upstream-release]

  workflow_dispatch:
    inputs:
      suwayomi_release:
        description: 'Suwayomi Server Release Version'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SUWAYOMI_RELEASE: ${{ github.event.client_payload.suwayomi_release || github.event.inputs.suwayomi_release || github.ref_name || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.SUWAYOMI_RELEASE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=true
          build-args: SUWAYOMI_RELEASE=${{ env.SUWAYOMI_RELEASE }}

    
      - name: Export multi-arch digest
        run: |
         
          TAG_TO_INSPECT="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SUWAYOMI_RELEASE }}"
          
          
          FULL_DIGEST="$(docker buildx imagetools inspect "$TAG_TO_INSPECT" --raw | jq -r '.descriptor.digest')"
                    
          if [ -z "$FULL_DIGEST" ]; then
            echo "Failed to retrieve multi-arch digest for $TAG_TO_INSPECT"
            exit 1
          fi
      
          mkdir -p /tmp/digests
                   
          SHORT_DIGEST="${FULL_DIGEST#sha256:}"

         
          echo "$FULL_DIGEST" > "/tmp/digests/$SHORT_DIGEST"

          echo "Successfully exported multi-arch digest: $FULL_DIGEST"
          echo "Created file: /tmp/digests/$SHORT_DIGEST"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1


  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          name: digests
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            # Use semver if your SUWAYOMI_RELEASE is semver-like, or just keep it raw
            type=semver,pattern=${{ env.SUWAYOMI_RELEASE }}

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

     
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Use the JSON from metadata-action
          # For each file in /tmp/digests (likely just one), we add it with the "sha256:" prefix
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SUWAYOMI_RELEASE }}


  create-release:
    runs-on: ubuntu-latest
    needs: merge
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.SUWAYOMI_RELEASE }}
          release_name: Release ${{ env.SUWAYOMI_RELEASE }}
          body: |
            Release of upstream ${{ env.IMAGE_NAME }}:${{ env.SUWAYOMI_RELEASE }}

            Docker images available at:
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SUWAYOMI_RELEASE }}`

            Pull the image using Docker:
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SUWAYOMI_RELEASE }}
            ```
          draft: false
          prerelease: false
